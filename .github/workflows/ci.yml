name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  architecture-check:
    name: Layer Dependency & Code Style Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Architectural Layers & Limits
        run: |
          python tools/check_layers.py

  native-build-and-test:
    name: Native Engine Build & Tests (Linux GCC)
    runs-on: ubuntu-latest
    needs: architecture-check
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-13
          python -m pip install --upgrade pip
          pip install python-chess

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_BUILD_TYPE=Release \
            -DLOOKAHEAD_BUILD_TESTS=ON \
            engine

      - name: Build Engine & Tests
        run: |
          cmake --build build --config Release

      - name: Run Unit Tests
        run: |
          ./build/lookahead_tests 2>&1 | tee -a $GITHUB_STEP_SUMMARY

      - name: Run UCI Protocol Verification
        run: |
          python tools/verify_uci.py

      - name: Run Match Runner Unit Tests
        run: |
          python tools/test_match_runner.py

      - name: Run Ablation Runner Unit Tests
        run: |
          python tools/test_run_ablation.py

      - name: Run Benchmark Profiler Unit Tests
        run: |
          python tools/test_run_bench.py

      - name: Run Engine Search Benchmark
        run: |
          python tools/run_bench.py --binary build/lookahead --depth 3

  sanitizer-checks:
    name: Clang AddressSanitizer & UBSan
    runs-on: ubuntu-latest
    needs: architecture-check
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-17
          python -m pip install --upgrade pip
          pip install python-chess

      - name: Configure CMake with Sanitizers
        run: |
          cmake -B build-san -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++-17 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLOOKAHEAD_ENABLE_SANITIZERS=ON \
            -DLOOKAHEAD_BUILD_TESTS=ON \
            engine

      - name: Build with Sanitizers
        run: |
          cmake --build build-san

      - name: Run Sanitized Tests
        run: |
          ./build-san/lookahead_tests 2>&1 | tee -a $GITHUB_STEP_SUMMARY

  wasm-build-and-verify:
    name: WebAssembly Build & Runtime Verification (Emscripten)
    runs-on: ubuntu-latest
    needs: architecture-check
    steps:
      - uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure CMake for WebAssembly
        run: |
          emcmake cmake -B build-wasm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLOOKAHEAD_BUILD_WASM=ON \
            -DLOOKAHEAD_BUILD_TESTS=OFF \
            engine

      - name: Build WebAssembly Module
        run: |
          cmake --build build-wasm --config Release

      - name: Verify WebAssembly Module in Node.js
        run: |
          node tools/verify_wasm.js build-wasm/lookahead.js
